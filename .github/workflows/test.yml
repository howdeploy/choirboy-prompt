name: test

on:
  push:
  pull_request:

jobs:
  powershell:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check native PowerShell installer
        run: ./scripts/test-powershell.ps1

  plugin:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run plugin suite
        env:
          # Git Bash otherwise copies directories for ln -s on Windows.
          MSYS: winsymlinks:nativestrict
        run: bash scripts/test.sh
      - name: Build custom-plugin ZIP
        run: python3 scripts/package-plugin.py
      - uses: actions/upload-artifact@v4
        if: matrix.os == 'ubuntu-latest'
        with:
          name: choirboy-prompt-plugin
          path: dist/*.zip
