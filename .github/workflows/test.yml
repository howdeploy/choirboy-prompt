name: test

on:
  push:
  pull_request:

jobs:
  plugin:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Claude Code validator
        run: npm install --global @anthropic-ai/claude-code
      - name: Run plugin suite
        run: bash scripts/test.sh
      - name: Build custom-plugin ZIP
        run: python3 scripts/package-plugin.py
      - uses: actions/upload-artifact@v4
        if: matrix.os == 'ubuntu-latest'
        with:
          name: choirboy-prompt-plugin
          path: dist/*.zip
